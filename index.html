<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colorful To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>To-Do <span>List</span></h1>
        <p>Small steps make big progress ♥</p>
      </div>
    </header>

    <section class="panel">
      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="✏️  Add a new task..." maxlength="120" required />
        <input id="dueDate" type="date" aria-label="Due date" />
        <select id="priority" aria-label="Priority">
          <option value="High">🔴 High</option>
          <option value="Medium" selected>🟡 Medium</option>
          <option value="Low">🟢 Low</option>
        </select>
        <button class="add-btn" type="submit">＋ Add Task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all">☷ All</button>
          <button class="filter" data-filter="pending">◯ Pending</button>
          <button class="filter" data-filter="completed">✓ Completed</button>
        </div>
        <button id="clearBtn" class="clear-btn" type="button">🗑 Clear All</button>
      </div>

      <p id="emptyState" class="empty" hidden>No tasks here yet. Add one above! ✨</p>
      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <footer class="stats">
        <span>☷ Total Tasks: <strong id="totalCount">0</strong></span>
        <span>🟢 Completed: <strong id="completedCount">0</strong></span>
        <span>🟠 Pending: <strong id="pendingCount">0</strong></span>
      </footer>
    </section>
    <p class="tip">Tip: Your tasks are saved in this browser automatically.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
